name: KCS Latest Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kcs-latest-release
  cancel-in-progress: false
  queue: max

jobs:
  build-and-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: latest
      RELEASE_TITLE: KCS Latest Release
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential cmake ninja-build python3 g++-mingw-w64-x86-64-posix
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          x86_64-w64-mingw32-g++ --version

      - name: Run portable behavior and HTTP checks
        run: |
          cmake --preset linux-debug
          cmake --build --preset linux-debug --parallel 2
          ctest --test-dir build/linux-debug --output-on-failure
          python3 tests/http_smoke.py --server build/linux-debug/http-smoke-host

      - name: Cross-compile the Windows x64 DLL
        run: |
          cmake --preset windows-release
          cmake --build --preset windows-release --parallel 2
          cmake --install build/windows-release --component Runtime --prefix out/windows-x64
          x86_64-w64-mingw32-objdump -f out/windows-x64/cabinet-status.dll

      - name: Prepare runtime release files
        run: |
          test -s out/windows-x64/cabinet-status.dll
          test -s out/windows-x64/cabinet-status.ini
          mkdir -p out/release
          cp out/windows-x64/cabinet-status.dll out/windows-x64/cabinet-status.ini out/release/

      - name: Generate release checksums
        working-directory: out/release
        run: |
          sha256sum cabinet-status.dll cabinet-status.ini > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Publish KCS Latest Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          {
            printf 'Automated Windows x64 build compiled on Linux from main.\n\n'
            printf 'Commit: `%s`\n\n' "$GITHUB_SHA"
            printf 'Actions run: %s/%s/actions/runs/%s\n\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'Runtime files: `cabinet-status.dll` and `cabinet-status.ini`.\n\n'
            printf 'Corresponding source: [browse](%s/tree/%s) | [download](%s/archive/%s.tar.gz).\n\n' \
              "$source_base" "$GITHUB_SHA" "$source_base" "$GITHUB_SHA"
            printf 'License: [GPL-3.0-only](%s/blob/%s/LICENSE).\n\n' "$source_base" "$GITHUB_SHA"
            printf 'Third-party sources and license notices: [dependency notices](%s/blob/%s/third_party/README.md).\n\n' \
              "$source_base" "$GITHUB_SHA"
            printf 'Toolchain license information: [MinGW-w64](https://packages.ubuntu.com/noble/mingw-w64-common) and [GCC](https://packages.ubuntu.com/noble/gcc-mingw-w64-base).\n\n'
            printf 'SHA-256 checksums for the runtime files are attached as `SHA256SUMS`.\n'
          } > "$RUNNER_TEMP/kcs-release-notes.md"
          assets=(
            out/release/cabinet-status.dll
            out/release/cabinet-status.ini
            out/release/SHA256SUMS
          )
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json id; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" \
              -f sha="$GITHUB_SHA" -F force=true
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TITLE" --target "$GITHUB_SHA" --latest \
              --notes-file "$RUNNER_TEMP/kcs-release-notes.md"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TITLE" --target "$GITHUB_SHA" --latest \
              --notes-file "$RUNNER_TEMP/kcs-release-notes.md"
          fi
          obsolete_assets="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | select(.name == "cabinet-status-source.tar.gz" or .name == "LICENSE" or .name == "THIRD_PARTY_NOTICES.txt") | .name')"
          while IFS= read -r asset; do
            if [[ -n "$asset" ]]; then
              gh release delete-asset "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY" --yes
            fi
          done <<< "$obsolete_assets"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json name,tagName,url,assets
